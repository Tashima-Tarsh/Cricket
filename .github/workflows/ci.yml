name: Regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install -e './dream11-edge[dev]'
      - run: python -m compileall -q gl_engine edgeforge dream11-edge/edge
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m pytest tests dream11-edge/tests edgeforge/score -q
      - run: python -m gl_engine.model_validation --output model-validation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-out-of-time-validation
          path: model-validation-report.json
          if-no-files-found: warn
        env:
          PYTHONPATH: dream11-edge
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
