name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest 'pydantic>=2.8,<3'

      - name: Run test suite
        run: |
          pytest tests/test_config.py tests/test_correlation_matrix.py tests/test_chaos_intelligence.py tests/test_optimizer.py tests/test_predictor.py tests/test_scenario_generator.py tests/test_free_intake.py tests/test_live_feed_no_fabrication.py -v
