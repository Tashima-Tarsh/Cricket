version: "3.8"

services:
  strike-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strike-os-platform
    restart: unless-stopped
    ports:
      - "${PORT:-8844}:8000"
    environment:
      - CRICKET_ENV=${CRICKET_ENV:-development}
      - CRICKET_ADMIN_TOKEN=${CRICKET_ADMIN_TOKEN:-}
      - CRICKET_ALLOWED_ORIGINS=${CRICKET_ALLOWED_ORIGINS:-http://localhost:8844,http://127.0.0.1:8844,http://localhost:5174,http://127.0.0.1:5174}
      - SPORTMONKS_API_TOKEN=${SPORTMONKS_API_TOKEN:-}
      - CRICKETDATA_API_KEY=${CRICKETDATA_API_KEY:-}
      - ROANUZ_PROJECT_KEY=${ROANUZ_PROJECT_KEY:-}
      - ROANUZ_API_KEY=${ROANUZ_API_KEY:-}
    volumes:
      - strike-fixtures:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M

volumes:
  strike-fixtures:
    name: strike-os-fixtures-data

