[project]
name = "dream11-edge"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "tenacity>=9.0",
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "pulp>=2.9",
  "lightgbm>=4.4",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
edge = "edge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
